<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#00E5C8" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06080F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5C8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5C8" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#00E5C8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="#06080F"/>
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Broadcast icon -->
  <g transform="translate(460 560)">
    <rect width="160" height="160" rx="40" fill="#0F2D2A"/>
    <circle cx="80" cy="80" r="8.8" fill="#00E5C8"/>
    <path d="M58 58 A 31.2 31.2 0 0 0 58 102" stroke="#00E5C8" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M46 46 A 48 48 0 0 0 46 114" stroke="#00E5C8" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M102 58 A 31.2 31.2 0 0 1 102 102" stroke="#00E5C8" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M114 46 A 48 48 0 0 1 114 114" stroke="#00E5C8" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  </g>

  <text x="540" y="920" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="700" text-anchor="middle" fill="url(#wordmark)" letter-spacing="-0.02em">AURA</text>
  <text x="540" y="970" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#9CA3AF" letter-spacing="0.2em">AUTOMATED URBAN RADIO AUDIO</text>

  <text x="540" y="1100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="500" text-anchor="middle" fill="#E8EAF0">AI-voiced news bulletins</text>
  <text x="540" y="1155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="500" text-anchor="middle" fill="#E8EAF0">for radio stations.</text>

  <g transform="translate(0 1500)">
    <path d="M 0 0 Q 67 -25 135 0 T 270 0 Q 337 -40 405 0 T 540 0 Q 607 -25 675 0 T 810 0 Q 877 -40 945 0 T 1080 0" stroke="url(#wave)" stroke-width="2.5" fill="none"/>
    <path d="M 0 -2 Q 67 -12 135 -2 T 270 -2 Q 337 -22 405 -2 T 540 -2 Q 607 -12 675 -2 T 810 -2 Q 877 -22 945 -2 T 1080 -2" stroke="url(#wave)" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <text x="540" y="1780" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#9CA3AF" letter-spacing="0.04em">aurapress.app</text>
</svg>
